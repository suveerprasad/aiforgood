version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --workers 2
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: AWS_REGION
      value: ap-south-1
    - name: SECRET_NAME
      value: bloodbridge/config
    - name: ENVIRONMENT
      value: production
